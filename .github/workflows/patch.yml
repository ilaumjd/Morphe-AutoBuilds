name: Build curated APKs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build configured entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAWL_URL: http://localhost:8191
        run: |
          set -euo pipefail
          jq -c '.patch_list[]' patch-config.json | while read -r entry; do
            app_name=$(jq -r '.app_name' <<< "$entry")
            source=$(jq -r '.source' <<< "$entry")
            arches=$(jq -r --arg app "$app_name" --arg source "$source" \
              '.[] | select(.app_name == $app and .source == $source) | .arches[]' \
              arch-config.json)
            for arch in $arches; do
              APP_NAME="$app_name" SOURCE="$source" ARCH="$arch" python -m src
            done
          done

      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=( *.apk )
          test "${#apks[@]}" -gt 0
          printf 'Curated build generated on %s UTC.\n' "$(date -u +'%Y-%m-%d %H:%M')" > release-notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${apks[@]}" --title "Latest build" --notes-file release-notes.md --latest
