name: Build curated APKs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build configured entries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAWL_URL: http://localhost:8191
        run: python -m src

      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=( dist/*.apk )
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APKs were built"
            exit 1
          fi
          {
            printf 'Curated build generated on %s UTC.\n\n' "$(date -u +'%Y-%m-%d %H:%M')"
            for apk in "${apks[@]}"; do printf -- '- `%s`\n' "${apk#dist/}"; done
          } > release-notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${apks[@]}" --title "Latest build" --notes-file release-notes.md --latest
