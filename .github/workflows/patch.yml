name: Build curated APKs

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when patch bundles are unchanged"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore patch state
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest --pattern .patch-state.json --dir . 2>/dev/null || true

      - name: Check patch sources
        id: updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_patch_updates.py --state .patch-state.json ${{ inputs.force && '--force' || '' }}

      - name: Set build date
        if: steps.updates.outputs.should_build == 'true'
        id: build-date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build configured entries
        if: steps.updates.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAWL_URL: http://localhost:8191
          BUILD_DATE: ${{ steps.build-date.outputs.value }}
        run: python -m src

      - name: Publish latest build
        if: steps.updates.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=( dist/*.apk )
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APKs were built"
            exit 1
          fi
          {
            printf 'Curated build generated on %s UTC.\n\n' "$(date -u +'%Y-%m-%d %H:%M')"
            for apk in "${apks[@]}"; do printf -- '- `%s`\n' "${apk#dist/}"; done
          } > release-notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${apks[@]}" .patch-state.json --title "Latest build" --notes-file release-notes.md --latest
